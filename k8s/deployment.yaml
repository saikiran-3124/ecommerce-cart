apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-cart
  labels:
    app: ecommerce-cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-cart
  template:
    metadata:
      labels:
        app: ecommerce-cart
    spec:
      containers:
        - name: ecommerce-cart
          image: ghcr.io/your-github-user/ecommerce-cart:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-cart
  labels:
    app: ecommerce-cart
spec:
  selector:
    app: ecommerce-cart
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
